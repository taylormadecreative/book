<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2308080a%27/%3E%3Cpath d=%27M5 12V5h7M20 5h7v7M27 20v7h-7M12 27H5v-7%27 stroke=%27%23e9b949%27 stroke-width=%273%27 fill=%27none%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%23e9b949%27/%3E%3C/svg%3E">
  <script>document.documentElement.classList.add("js");</script>
  <title>Studio — Taylormade Booking</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin.css?v=5">
</head>
<body>

  <!-- login -->
  <div class="login-wrap" id="loginView">
    <div class="login-mark">
      <span class="wordmark">TAYLORMADE<i>/</i>CREATIVE</span>
      <span class="studio-tag">Studio</span>
    </div>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
      <button class="btn btn-gold" id="loginBtn" type="submit">Sign in</button>
      <div class="login-err" id="loginErr"></div>
    </form>
    <div class="login-or" aria-hidden="true"><span></span>or<span></span></div>
    <button class="btn btn-ghost" id="googleBtn" type="button">Continue with Google</button>
  </div>

  <!-- app -->
  <div id="appView" hidden>
    <header class="abar">
      <a class="brand" href="index.html">
        <span class="wordmark">TAYLORMADE<i>/</i>CREATIVE</span>
        <span class="studio-tag">Studio</span>
      </a>
      <div class="stats" id="stats"></div>
      <nav class="abar-nav">
        <a href="growth.html">Growth <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11l6-6M6 5h5v5"/></svg></a>
        <a href="schedule.html">Schedule <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11l6-6M6 5h5v5"/></svg></a>
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <button class="linkish" id="logoutBtn">Sign out</button>
      </nav>
    </header>

    <div class="amain">
      <aside class="lpane">
        <div class="lpane-head">
          <div class="lpane-title">
            <h2>Pipeline</h2>
            <button class="btn btn-gold" id="newProjBtn">+ New project</button>
          </div>
          <label class="psearch">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
            <input type="search" id="pSearch" placeholder="Search projects…" aria-label="Search projects" autocomplete="off" spellcheck="false">
          </label>
          <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
        </div>
        <div class="newproj" id="newProj" hidden>
          <div class="bgrid">
            <input id="npName" maxlength="120" placeholder="Client name *">
            <input id="npEmail" type="email" maxlength="200" placeholder="Email *">
            <input id="npPhone" maxlength="40" placeholder="Phone">
            <select id="npService">
              <option value="music_video">Music video</option>
              <option value="brand_content">Brand content</option>
              <option value="photography">Photography</option>
              <option value="event">Event</option>
              <option value="other">Other</option>
            </select>
            <input id="npDate" type="date">
            <input id="npLocation" maxlength="240" placeholder="Location">
          </div>
          <div class="actions">
            <button class="btn btn-gold" id="npCreate">Create</button>
            <button class="btn btn-ghost" id="npCancel">Cancel</button>
          </div>
        </div>
        <div class="plist" id="plist" aria-busy="true"><div class="sk-row" aria-hidden="true"><span><i></i><i></i></span><b></b></div><div class="sk-row" aria-hidden="true"><span><i></i><i></i></span><b></b></div><div class="sk-row" aria-hidden="true"><span><i></i><i></i></span><b></b></div><div class="sk-row" aria-hidden="true"><span><i></i><i></i></span><b></b></div><div class="sk-row" aria-hidden="true"><span><i></i><i></i></span><b></b></div></div>
      </aside>

      <main class="dpane" id="dpane">
        <div class="dempty">Pick a project from the pipeline</div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js?v=5"></script>
</body>
</html>
