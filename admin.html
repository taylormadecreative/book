<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2308080a%27/%3E%3Cpath d=%27M5 12V5h7M20 5h7v7M27 20v7h-7M12 27H5v-7%27 stroke=%27%23e9b949%27 stroke-width=%273%27 fill=%27none%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%274%27 fill=%27%23e9b949%27/%3E%3C/svg%3E">
  <script>document.documentElement.classList.add("js");</script>
  <title>Studio — Taylormade Booking</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Familjen+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- login -->
  <div class="login-wrap" id="loginView">
    <span class="hud"><span class="tick">●</span> STUDIO ACCESS</span>
    <h1>Taylormade<span style="color:var(--gold);">/</span>Studio</h1>
    <form id="loginForm">
      <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
      <button class="btn btn-gold" id="loginBtn" type="submit" style="width:100%;">Sign in</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div>

  <!-- app -->
  <div id="appView" hidden>
    <div class="abar">
      <a class="nav-logo" href="index.html" style="font-family:var(--font-display);font-weight:700;font-size:0.9rem;color:var(--text);">TAYLORMADE<span style="color:var(--gold);">/</span>STUDIO</a>
      <div class="stats" id="stats"></div>
      <div style="display:flex;gap:1rem;align-items:center;">
        <a href="growth.html" style="color:var(--muted);font-size:0.85rem;">Growth →</a>
        <a href="schedule.html" style="color:var(--muted);font-size:0.85rem;">Schedule →</a>
        <button class="linkish" id="logoutBtn">Sign out</button>
      </div>
    </div>

    <div class="amain">
      <aside class="lpane">
        <div class="lpane-head">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:0.6rem;">
            <span class="hud">PIPELINE</span>
            <button class="btn btn-ghost" id="newProjBtn" style="font-size:0.78rem;padding:0.45em 1em;">+ New project</button>
          </div>
          <div class="filters" id="filters"></div>
        </div>
        <div class="newproj" id="newProj" hidden>
          <div class="bgrid">
            <input id="npName" maxlength="120" placeholder="Client name *">
            <input id="npEmail" type="email" maxlength="200" placeholder="Email *">
            <input id="npPhone" maxlength="40" placeholder="Phone">
            <select id="npService">
              <option value="music_video">Music video</option>
              <option value="brand_content">Brand content</option>
              <option value="photography">Photography</option>
              <option value="event">Event</option>
              <option value="other">Other</option>
            </select>
            <input id="npDate" type="date">
            <input id="npLocation" maxlength="240" placeholder="Location">
          </div>
          <div class="actions">
            <button class="btn btn-gold" id="npCreate" style="font-size:0.82rem;">Create</button>
            <button class="btn btn-ghost" id="npCancel" style="font-size:0.82rem;">Cancel</button>
          </div>
        </div>
        <div class="plist" id="plist"></div>
      </aside>

      <main class="dpane" id="dpane">
        <div class="dempty">SELECT A PROJECT</div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
