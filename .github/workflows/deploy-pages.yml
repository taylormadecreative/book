name: Deploy to GitHub Pages

# Static deploy via GitHub Actions instead of the legacy Jekyll builder.
# The legacy builder 0-duration-fails when a CNAME file is present on this repo;
# this workflow deploys the static files directly and honors the CNAME custom domain.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never cancel an in-progress deploy; let each finish so the live site is consistent
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:db
      - run: npm run test:edge
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/package-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.site-build'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
